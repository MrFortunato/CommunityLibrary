<!-- login.component.html -->
<div class="form-container flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-bold text-center mb-6">Login to Your Account</h2>
    <form [formGroup]="loginForm" (ngSubmit)="submitData()"  class="space-y-4">
      <div>
        <label for="username" class="block mb-1">Username</label>
        <input id="username" type="text" formControlName="email" class="w-full p-3 border rounded-md" placeholder="Email">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-600 text-sm mt-1">
          <p *ngIf="loginForm.get('email')?.errors?.['required']">Email é obrigatório.</p>
          <p  *ngIf="loginForm.get('email')?.errors?.['email']">Formato de email inválido.</p>
        </div>
      </div>
      <div>
        <label for="password" class="block mb-1">Password</label>
        <input id="password" type="password" formControlName="password" class="w-full p-3 border rounded-md" placeholder="Password ">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-600 text-sm mt-1">
          <p  *ngIf="loginForm.get('password')?.errors?.['required']">A senha é obrigatória.</p>
          <p  *ngIf="loginForm.get('password')?.errors?.['minlength']">A senha deve ter pelo menos 6 caracteres.</p>
        </div>
      </div>
      <div class="flex items-center">
        <input id="rememberMe" type="checkbox" formControlName="rememberMe" class="mr-2">
        <label for="rememberMe">Remember me</label>
      </div>
      <button type="submit" [disabled]="loginForm.invalid" class="w-full p-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-400">Login</button>
      <div class="text-center mt-4">
        <p>Don't have account? <a [routerLink]="['/sign-up']" class="text-blue-600 hover:text-blue-700">Create an account</a></p>
      </div>
    </form>
  </div>
</div>
