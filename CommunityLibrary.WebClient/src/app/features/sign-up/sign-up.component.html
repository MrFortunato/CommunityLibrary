<!-- signup.component.html -->
<div class="form-container items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-bold text-center mb-6">Sign-Up for an Account</h2>
    <form [formGroup]="signUpForm" (ngSubmit)="submitSignUp()" class="space-y-4">
      <div>
        <label for="name" class="block mb-1">Name</label>
        <input id="name" type="text" formControlName="name" class="w-full p-3 border rounded-md" placeholder="Name">
      </div>
      <div>
        <label for="email" class="block mb-1">Email</label>
        <input id="email" type="email" formControlName="email" class="w-full p-3 border rounded-md" placeholder="Email">
      </div>
      <div>
        <label for="password" class="block mb-1">Password</label>
        <input id="password" type="password" formControlName="password"  class="w-full p-3 border rounded-md" placeholder="Password">
      </div>
      <div>
        <label for="confirmPassword" class="block mb-1">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="w-full p-3 border rounded-md" placeholder="Confirm Password">
      </div>
      <button type="submit" class="w-full p-3 bg-blue-600 text-white rounded-md hover:bg-blue-700">Sign Up</button>
      <div class="text-center mt-4">
        <p>Already have an account? <a [routerLink]="['/login']" class="text-blue-600 hover:text-blue-700">Login here</a></p>
      </div>
    </form>
  </div>
</div>
